<!doctype html><meta charset="utf-8"><title>attach</title>
<iframe id="f" style="width:1200px;height:800px;border:0"></iframe>
<script>
const L=[];const ok=(n,c,x)=>L.push((c?"PASS":"FAIL")+" "+n+(c?"":"  <"+x+">"));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,label,ms){const t0=Date.now();while(Date.now()-t0<(ms||8000)){let v;try{v=fn()}catch(e){}if(v)return v;await sleep(80)}throw new Error("超时: "+label)}
const mkFile=(name,size,type)=>new File([new Uint8Array(size||10)],name,{type:type||"application/pdf"});
(async()=>{
try{
  await new Promise(r=>indexedDB.deleteDatabase("lvyue_cloud").onsuccess=r.onerror=r);
  localStorage.setItem("lvyue_cloud_cfg",JSON.stringify({forceLocal:true}));
  sessionStorage.clear();
  const f=document.getElementById("f"); f.src="index.html?"+Date.now();
  await new Promise(r=>f.onload=r);
  await until(()=>f.contentWindow.LY,"LY");
  const w0=f.contentWindow, w=w0.LY, $=s=>w0.document.querySelector(s), $$=s=>[...w0.document.querySelectorAll(s)];
  await until(()=>$("#doInit"),"建号");
  $("#iU").value="admin";$("#iN").value="何祥财";$("#doInit").click();
  await until(()=>$("#doLoginNow"),"密码卡");$("#doLoginNow").click();
  await until(()=>!$(".app").hidden,"进入系统");

  /* 准备三份合同 */
  const head=["合同号","订单编号","供应商","合同名称","合同总额"].join("\t");
  const rows=[["HCMH20250516-02","CD2505210662","赣州长景五金","五金杂项","36307.32"],
              ["HCMH20250516-2","CD9999","干扰项供应商","干扰合同","1000"],
              ["HT-88","CD777","乙供应商","设备","50000"]].map(r=>r.join("\t"));
  $("#pasteBox").value=[head,...rows].join("\n");
  w.preview($("#pasteBox").value); await w.doImport();
  ok("准备合同",w.Store.be.all("contracts").length===3,w.Store.be.all("contracts").length);
  w.reload();
  const rowsV=w.Store.view();
  const c1=rowsV.find(v=>v.o.contract_no==="HCMH20250516-02");
  const c3=rowsV.find(v=>v.o.contract_no==="HT-88");

  /* 文件名匹配 */
  const m1=w.matchFileToContract("HCMH20250516-02 装箱单.pdf",rowsV);
  ok("按合同号匹配",m1&&m1.id===c1.o.id,JSON.stringify(m1));
  const m2=w.matchFileToContract("CD2505210662发票.pdf",rowsV);
  ok("按订单编号匹配",m2&&m2.id===c1.o.id&&m2.by==="订单编号",JSON.stringify(m2));
  const m3=w.matchFileToContract("随便一个名字.pdf",rowsV);
  ok("认不出的返回空",!m3,JSON.stringify(m3));
  /* 最长匹配：文件名含 HCMH20250516-02，不能错配到更短的 HCMH20250516-2 */
  ok("最长匹配优先",m1&&m1.hit==="HCMH20250516-02",m1&&m1.hit);
  /* 大小写与分隔符容错 */
  const m4=w.matchFileToContract("hcmh2025 0516-02_扫描件.PDF",rowsV);
  ok("忽略大小写和空格",m4&&m4.id===c1.o.id,JSON.stringify(m4));
  const m5=w.matchFileToContract("ht88 合同.pdf",rowsV);
  ok("短编号也能匹配",m5&&m5.id===c3.o.id,JSON.stringify(m5));

  /* 批量选择：混合已匹配/未匹配/超大 */
  w.go("data");
  w.bulkPickFiles([
    mkFile("HCMH20250516-02 合同扫描件.pdf",2048),
    mkFile("CD2505210662 发票.jpg",1024,"image/jpeg"),
    mkFile("不知道是啥.docx",512,"application/vnd.openxmlformats-officedocument.wordprocessingml.document"),
    mkFile("HT-88 巨大文件.pdf",9*1024*1024)
  ]);
  await until(()=>$("#doBulkAtt"),"批量预览");
  ok("预览行数",$$("#attBulkPreview tbody tr").length===4,$$("#attBulkPreview tbody tr").length);
  ok("自动匹配2个",w.BULK.filter(b=>b.contractId&&!b.tooBig).length===2,
     w.BULK.map(b=>b.contractId?"Y":"N").join(""));
  ok("超大文件被标记",w.BULK[3].tooBig===true,w.BULK[3].tooBig);
  ok("按钮显示待传数",$("#doBulkAtt").textContent.includes("2"),$("#doBulkAtt").textContent);

  /* 手动给未匹配的指定合同 */
  const sel=$$("[data-bulkpick]").find(s=>+s.dataset.bulkpick===2);
  sel.value=c3.o.id; sel.dispatchEvent(new Event("change",{bubbles:true}));
  await sleep(200);
  ok("手动指定后计数变3",$("#doBulkAtt").textContent.includes("3"),$("#doBulkAtt").textContent);

  /* 真正上传 */
  $("#doBulkAtt").click();
  await until(()=>!w.BULK,"上传完成",15000);
  await sleep(400);
  const atts=w.Store.be.all("attachments");
  ok("上传数量",atts.length===3,atts.length);
  ok("附件归到正确合同",atts.filter(a=>a.contract_id===c1.o.id).length===2,
     atts.map(a=>a.name+"->"+(a.contract_id===c1.o.id?"c1":a.contract_id===c3.o.id?"c3":"?")).join(" | "));
  ok("超大文件没被上传",!atts.some(a=>a.name.includes("巨大")),atts.map(a=>a.name).join(","));
  const back=await w.Store.be.getFile(atts[0].id);
  ok("附件内容可读回",typeof back==="string"&&back.startsWith("data:"),String(back).slice(0,24));
  const audit=w.Store.be.all("audit").filter(a=>/批量上传附件/.test(a.what));
  ok("有留痕",audit.length>=1,audit.map(a=>a.what).join(" / ").slice(0,80));

  /* 附件出现在合同详情页 */
  w.openD(c1.o.id); w.tabI=3; w.drawTab();
  await sleep(200);
  ok("详情页能看到附件",$("#dbody").textContent.includes("合同扫描件"),$("#dbody").textContent.slice(0,80));

}catch(e){ L.push("FAIL 异常 "+e.message+" @"+String(e.stack||"").split("\n")[1]) }
const fails=L.filter(x=>x.startsWith("FAIL")).length;
const out=(fails?"FAILED("+fails+")":"ALLPASS("+L.length+")")+"\n"+L.join("\n");
try{ await fetch("/report",{method:"POST",body:out}) }catch(e){}
document.title="done";
})();
</script>
