<!doctype html><meta charset="utf-8"><title>pending</title>
<script src="app-core.js"></script>
<script>
const L=[];const ok=(n,c,extra)=>L.push((c?"PASS":"FAIL")+" "+n+(c?"":" <"+extra+">"));
(async()=>{
try{
  /* 1. 日期规整 */
  ok("date_slash",normDate("2025/6/5")==="2025-06-05",normDate("2025/6/5"));
  ok("date_cn",normDate("2025年6月5日")==="2025-06-05",normDate("2025年6月5日"));
  ok("date_serial",normDate("45813")==="2025-06-05",normDate("45813"));
  ok("date_serial2",normDate("45292")==="2024-01-01",normDate("45292"));
  ok("date_empty",normDate("—")==="",normDate("—"));
  ok("num_comma",num("1,234,567.89")===1234567.89,num("1,234,567.89"));

  /* 2. 密码 */
  const p=randPw(12);
  ok("pw_len",p.length===12,p.length);
  ok("pw_classes",/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/[0-9]/.test(p),p);
  ok("pw_noconfuse",!/[0O1lI]/.test(p),p);
  const h1=await hashPw("abc","s1"), h2=await hashPw("abc","s1"), h3=await hashPw("abc","s2");
  ok("hash_stable",h1===h2); ok("hash_salted",h1!==h3); ok("hash_len",h1.length===64,h1.length);

  /* 3. 本机后端 + 账号 */
  const be=await Store.useLocal();
  await be.replaceAll(emptyDB());
  const pw=randPw(12);
  await be.createUser({username:"admin",name:"何祥财",role:"admin",password:pw});
  const who=await be.login("admin",pw);
  ok("login_ok",who.username==="admin"&&who.role==="admin",JSON.stringify(who));
  let bad=false; try{await be.login("admin","wrong")}catch(e){bad=true}
  ok("login_reject",bad);
  let dup=false; try{await be.createUser({username:"admin",password:"x"})}catch(e){dup=true}
  ok("user_dup_reject",dup);

  /* 4. 导入解析 */
  const tsv=["合同号\t供应商\t合同名称\t合同总额\t签订日期\t约定交期\t承诺交期\t付款条件",
    "T-001\t甲公司\t钢材\t1,000,000.00\t2025/6/1\t2026/8/5\t2026/8/5\t预付30%，货到付60%，质保金10%",
    "T-002\t乙公司\t设备\t50000\t2025/7/1\t2026/9/1\t\t月结30天"].join("\n");
  const P=parseTable(tsv);
  ok("parse_rows",P.data.length===2,P.data&&P.data.length);
  ok("parse_notmat",P.isMaterial===false,P.isMaterial);
  const bad2=parseTable("供应商\t金额\n甲\t1");
  ok("parse_needs_no",!!bad2.error,JSON.stringify(bad2).slice(0,60));

  /* 5. 合同计算 + 物料行到货 */
  const c1={id:"c1",contract_no:"T-001",total_amount:1000000,promised_delivery_date:"2026-08-05",contract_delivery_date:"2026-08-05",sign_date:"2025-06-01",pay_condition_text:"预付30%，货到付60%，质保金10%"};
  const m1={id:"m1",contract_id:"c1",material_name:"方管",plan_qty:100,amount_tax_in:600000};
  const m2={id:"m2",contract_id:"c1",material_name:"螺栓",plan_qty:200,amount_tax_in:400000};
  const arrs=[{id:"a1",contract_id:"c1",material_id:"m1",qty:100,amount:600000,date:"2026-08-01"},
              {id:"a2",contract_id:"c1",material_id:"m2",qty:50,amount:100000,date:"2026-08-02"}];
  const cc=calcContract(c1,[m1,m2],arrs,[],[]);
  ok("calc_arr",cc.arr===700000,cc.arr);
  ok("calc_arrPct",Math.abs(cc.arrPct-0.7)<1e-9,cc.arrPct);
  ok("calc_owe",cc.owe===1000000,cc.owe);
  const expLate=Math.max(0,Math.round((new Date(new Date().toDateString())-new Date("2026-08-05T00:00:00"))/864e5));
  ok("calc_late",cc.late===expLate,cc.late+" 期望 "+expLate+" (today "+iso(TODAY)+")");
  ok("calc_sev",cc.sev==="crit",cc.sev);
  ok("line_short",cc.shortLines.length===1&&cc.shortLines[0].short===150,JSON.stringify(cc.shortLines.map(l=>l.short)));
  ok("line_pct",Math.abs(cc.lines[0].pct-1)<1e-9&&Math.abs(cc.lines[1].pct-0.25)<1e-9,cc.lines.map(l=>l.pct).join(","));

  /* 6. 付款节点生成 */
  const pl=genPlan(c1,cc);
  ok("plan_n",pl.length===3,JSON.stringify(pl.map(x=>x.name)));
  ok("plan_ratio",Math.abs(pl.reduce((s,x)=>s+x.ratio,0)-1)<1e-9,pl.reduce((s,x)=>s+x.ratio,0));
  ok("plan_prepay_due",pl[0].due_date==="2025-06-01",pl[0].due_date);
  ok("plan_warranty_due",pl[2].due_date==="2027-08-05",pl[2].due_date);
  ok("plan_amount",pl[0].amount===300000,pl[0].amount);
  const c2={id:"c2",total_amount:50000,contract_delivery_date:"2026-09-01",pay_condition_text:"月结30天"};
  const cc2=calcContract(c2,[],[],[],[]);
  const pl2=genPlan(c2,cc2);
  ok("plan_monthly",pl2.length===1&&pl2[0].due_date==="2026-10-01",JSON.stringify(pl2));
  const pl3=genPlan({id:"c3",total_amount:100,pay_condition_text:""},calcContract({id:"c3",total_amount:100},[],[],[],[]));
  ok("plan_blank",pl3.length===1&&pl3[0].ratio===1,JSON.stringify(pl3));

  /* 7. 增删改查落盘 */
  await be.insert("contracts",Object.assign({},c1));
  await be.insert("materials",Object.assign({},m1));
  await be.update("contracts","c1",{logistics_owner:"张伟"});
  ok("crud_update",be.all("contracts")[0].logistics_owner==="张伟");
  const be2=await LocalBackend.init();
  ok("persist",be2.all("contracts").length===1&&be2.all("contracts")[0].logistics_owner==="张伟",be2.all("contracts").length);
  await be.remove("contracts","c1");
  ok("crud_remove",be.all("contracts").length===0);
  /* 9. 云端配置来源：默认配置不能被浏览器里的旧副本钉死 */
  const CFGK="lvyue_cloud_cfg", saved=localStorage.getItem(CFGK);
  localStorage.removeItem(CFGK);
  ok("cfg_default",(CloudBackend.cfg()||{}).url===DEFAULT_CLOUD_CFG.url,JSON.stringify(CloudBackend.cfg()));
  /* 没有 manual 标记 = 老版本 init() 自己抄进来的默认配置副本，必须忽略，
     否则默认地址/密钥更新后老浏览器永远拿旧的，表现成"突然登不上了" */
  localStorage.setItem(CFGK,JSON.stringify({url:"https://stale.supabase.co",key:"old_anon_key"}));
  ok("cfg_ignores_stale_copy",(CloudBackend.cfg()||{}).url===DEFAULT_CLOUD_CFG.url,JSON.stringify(CloudBackend.cfg()));
  /* 手工在「接入云端」填的才算覆盖 */
  localStorage.setItem(CFGK,JSON.stringify({url:"https://mine.supabase.co",key:"k",manual:true}));
  ok("cfg_manual_wins",(CloudBackend.cfg()||{}).url==="https://mine.supabase.co",JSON.stringify(CloudBackend.cfg()));
  localStorage.setItem(CFGK,JSON.stringify({forceLocal:true}));
  ok("cfg_force_local",CloudBackend.cfg()===null,JSON.stringify(CloudBackend.cfg()));
  /* init() 不再把配置写回 localStorage */
  localStorage.removeItem(CFGK);
  await CloudBackend.init();
  ok("init_no_writeback",localStorage.getItem(CFGK)===null,localStorage.getItem(CFGK));
  /* 换了项目/密钥后，旧会话必须作废，否则后面每个请求都 401 */
  localStorage.setItem("lvyue_sess",JSON.stringify({token:"t",user:{id:"u"},stamp:"https://other.supabase.co|k"}));
  await CloudBackend.init({url:DEFAULT_CLOUD_CFG.url,key:DEFAULT_CLOUD_CFG.key});
  ok("stale_session_dropped",CloudBackend.token===null&&localStorage.getItem("lvyue_sess")===null,String(CloudBackend.token));
  localStorage.setItem("lvyue_sess",JSON.stringify({token:"t2",user:{id:"u"},stamp:DEFAULT_CLOUD_CFG.url+"|"+DEFAULT_CLOUD_CFG.key}));
  await CloudBackend.init({url:DEFAULT_CLOUD_CFG.url,key:DEFAULT_CLOUD_CFG.key});
  ok("matching_session_kept",CloudBackend.token==="t2",String(CloudBackend.token));
  CloudBackend.logout();
  if(saved===null)localStorage.removeItem(CFGK);else localStorage.setItem(CFGK,saved);

  /* 10. 表头写法差异：单位后缀、前缀、同义词
     取自用户实际导出的「摩通合同列表」表头（数据已替换成假数据）。
     这 15 列里原先有 9 列认不出来，其中包括物料名称和物料编号，
     导致整表被误判成合同台账表，385 份合同全成空壳、总额 3.07 亿显示成 0。 */
  ok("head_unit_suffix_full",headKey("含税单价（元）")==="price_tax_in",headKey("含税单价（元）"));
  // 用户表里这一列的括号是「半角左 + 全角右」，不是笔误，是真实数据
  ok("head_unit_suffix_mixed",headKey("价税合计(元）")==="amount_tax_in",headKey("价税合计(元）"));
  ok("head_prefix_material",headKey("合同物料名称")==="material_name",headKey("合同物料名称"));
  ok("head_prefix_spec",headKey("合同规格型号")==="spec",headKey("合同规格型号"));
  ok("head_alias_orderno",headKey("采购订单号")==="order_no",headKey("采购订单号"));
  ok("head_alias_matcode",headKey("物料编号")==="material_code",headKey("物料编号"));
  ok("head_alias_taxrate",headKey("增值税率")==="tax_rate",headKey("增值税率"));
  /* 前缀剥离绝不能吃掉本身就是正式字段名的表头 */
  ok("head_prefix_safe_no",headKey("合同号")==="contract_no",headKey("合同号"));
  ok("head_prefix_safe_amt",headKey("合同总额")==="total_amount",headKey("合同总额"));
  ok("head_prefix_safe_name",headKey("合同名称")==="contract_name",headKey("合同名称"));
  ok("head_prefix_safe_org",headKey("采购组织")==="purchase_org",headKey("采购组织"));
  ok("head_prefix_safe_buyer",headKey("采购员")==="purchaser",headKey("采购员"));
  ok("head_unknown_stays_null",headKey("不含税金额（元）")===null,headKey("不含税金额（元）"));

  /* 整表按用户的真实表头解析：必须判成物料明细表，且金额列要认出来 */
  const REALHEAD=["合同号","供应商","采购订单号","付款条件","序号","合同物料名称","合同规格型号","单位",
    "数量","含税单价（元）","不含税金额（元）","增值税率","增值税（元）","价税合计(元）","物料编号"].join("\t");
  const REALROWS=[
    ["HT-9001","示例供应商甲","POD-9001","预付30%，发货付70%","1","发电机组","800kW","台","5","1000000","4424778.76","0.13","575221.24","5000000","WL9000001"],
    ["HT-9001","示例供应商甲","POD-9001","预付30%，发货付70%","2","发电机组","1200kW","套","4","500000","1769911.5","0.13","230088.5","2000000","WL9000002"],
    ["HT-9002","示例供应商乙","POD-9002","货到付100%","1","铝板","Q345B","千克","100","23.5","2079.65","0.13","270.35","2350","WL9000003"]
  ].map(r=>r.join("\t"));
  const PT=parseTable([REALHEAD,...REALROWS].join("\n"));
  ok("real_head_is_material",PT.isMaterial===true,String(PT.isMaterial));
  ok("real_head_rows",PT.data.length===3,PT.data.length);
  ok("real_head_amount",PT.data[0].amount_tax_in==="5000000",PT.data[0].amount_tax_in);
  ok("real_head_matname",PT.data[0].material_name==="发电机组",PT.data[0].material_name);
  ok("real_head_matcode",PT.data[0].material_code==="WL9000001",PT.data[0].material_code);
  ok("real_head_qty",PT.data[0].plan_qty==="5",PT.data[0].plan_qty);
  ok("real_head_ignored",PT.head.filter((h,i)=>!PT.keys[i]).length===2,PT.head.filter((h,i)=>!PT.keys[i]).join("、"));

}catch(e){ L.push("FAIL exception "+e.message+" @"+String(e.stack||"").split("\n")[1]) }
const fails=L.filter(x=>x.startsWith("FAIL")).length;
const out=(fails?"FAILED("+fails+")":"ALLPASS")+"\n"+L.join("\n");
document.title=out.split("\n")[0];
try{ await fetch("/report",{method:"POST",body:out}) }catch(e){}

})();
</script>
